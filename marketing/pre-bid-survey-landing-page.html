31L23 24Z\" fill=\"#f08a4b\"><\u002Fpath><path d=\"M8 12H28\" stroke=\"#e7ecea\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-family: 'Barlow Semi Condensed', Arial, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .02em\">[Company Name]<\u002Fspan>\n<\u002Fa>\n<nav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 24px; font-weight: 500\">\n<a href=\"#problems\" style=\"color: #c7d0cc; text-decoration: none\">What we catch<\u002Fa>\n<a href=\"#packages\" style=\"color: #c7d0cc; text-decoration: none\">Packages<\u002Fa>\n<a href=\"#deliverables\" style=\"color: #c7d0cc; text-decoration: none\">What you get<\u002Fa>\n<a href=\"#contact\" style=\"background: #f08a4b; color: #1a120c; text-decoration: none; font-weight: 600; padding: 11px 18px; border-radius: 8px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Book a survey<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section id=\"top\" style=\"background: #161c1b; color: #e7ecea; background-image: linear-gradient(rgba(231,236,234,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(231,236,234,.05) 1px, transparent 1px); background-size: 32px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 32px 88px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<div style=\"flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; color: #f08a4b; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 14px\">Pre-bid surveys for bathroom remodels<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Barlow Semi Condensed', Arial, sans-serif; font-weight: 700; font-size: 64px; line-height: 1.02; letter-spacing: -.01em\">Bid the bathroom you’ll actually build.<\u002Fh1>\n<p style=\"margin: 0; font-size: 20px; color: #c7d0cc; max-width: 560px\">A carpenter measures the room and solves the tile layout, niche, vanity wall and rough-ins before you price the job. Your bid covers what’s behind the wall, not just what’s in front of it.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px\">\n<a href=\"#contact\" style=\"background: #f08a4b; color: #1a120c; text-decoration: none; font-weight: 600; font-size: 18px; padding: 14px 24px; border-radius: 8px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center\">Book a pre-bid survey<\u002Fa>\n<a href=\"#deliverables\" style=\"color: #e7ecea; text-decoration: none; font-weight: 600; font-size: 18px; padding: 14px 24px; border-radius: 8px; border: 1px solid #44524d; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center\">See a sample report<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin: 0; color: #9ba7a3; font-size: 15px\">Flat fee, paid whether or not you win the job. Built for small contractors.<\u002Fp>\n<\u002Fdiv>\n\n<!-- interactive before/after -->\n<div style=\"flex: 1 1 400px; min-width: 0; background: #1f2826; border: 1px solid #33403c; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-family: 'Barlow Semi Condensed', Arial, sans-serif; font-weight: 700; font-size: 20px\">Tub wall, 60″ × 96″<\u002Fspan>\n<div role=\"group\" aria-label=\"Layout\" style=\"display: flex; background: #161c1b; border-radius: 10px; padding: 4px; gap: 4px\">\n<sc-if value=\"{{isBefore}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" sc-camel-on-click=\"{{showBefore}}\" aria-pressed=\"true\" style=\"border: 0; border-radius: 7px; padding: 8px 14px; min-height: 40px; font: inherit; font-weight: 600; cursor: pointer; background: #f08a4b; color: #1a120c\">Guesswork<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{showAfter}}\" aria-pressed=\"false\" style=\"border: 0; border-radius: 7px; padding: 8px 14px; min-height: 40px; font: inherit; font-weight: 600; cursor: pointer; background: transparent; color: #c7d0cc\">Solved<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{isAfter}}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" sc-camel-on-click=\"{{showBefore}}\" aria-pressed=\"false\" style=\"border: 0; border-radius: 7px; padding: 8px 14px; min-height: 40px; font: inherit; font-weight: 600; cursor: pointer; background: transparent; color: #c7d0cc\">Guesswork<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{showAfter}}\" aria-pressed=\"true\" style=\"border: 0; border-radius: 7px; padding: 8px 14px; min-height: 40px; font: inherit; font-weight: 600; cursor: pointer; background: #f08a4b; color: #1a120c\">Solved<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 360 440\" role=\"img\" aria-label=\"{{svgLabel}}\" style=\"width: 100%; height: auto; display: block\">\n<rect x=\"30\" y=\"30\" width=\"300\" height=\"380\" fill=\"#eef0ec\"><\u002Frect>\n<sc-if value=\"{{isBefore}}\" hint-placeholder-val=\"{{ false }}\">\n<rect x=\"30\" y=\"30\" width=\"300\" height=\"11\" fill=\"#f07f72\" fill-opacity=\".55\"><\u002Frect>\n<path d=\"{{groutBefore}}\" stroke=\"#8d9a95\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath>\n<rect x=\"120\" y=\"160\" width=\"90\" height=\"84\" fill=\"#d4d9d6\" stroke=\"#f07f72\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\"><\u002Frect>\n<\u002Fsc-if>\n<sc-if value=\"{{isAfter}}\" hint-placeholder-val=\"{{ true }}\">\n<path d=\"{{groutAfter}}\" stroke=\"#8d9a95\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath>\n<rect x=\"120\" y=\"182\" width=\"90\" height=\"76\" fill=\"#d4d9d6\" stroke=\"#5fc49f\" stroke-width=\"2.5\"><\u002Frect>\n<path d=\"M120 258H210\" stroke=\"#ffffff\" stroke-width=\"4\"><\u002Fpath>\n<\u002Fsc-if>\n<rect x=\"30\" y=\"30\" width=\"300\" height=\"380\" fill=\"none\" stroke=\"#e7ecea\" stroke-width lls, plumbing, electrical, framing and conditions, recorded on site.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 10px; border-top: 3px solid #1c2321; padding-top: 18px\"><span style=\"font-family: 'Barlow Semi Condensed', Arial, sans-serif; font-weight: 700; font-size: 40px; color: #c9541a; line-height: 1\">03<\u002Fspan><strong style=\"font-size: 19px\">You bid with the report<\u002Fstrong><span style=\"color: #4a5551\">Price the real job, with the problems already found.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 10px; border-top: 3px solid #c9541a; padding-top: 18px\"><span style=\"font-family: 'Barlow Semi Condensed', Arial, sans-serif; font-weight: 700; font-size: 40px; color: #c9541a; line-height: 1\">04<\u002Fspan><strong style=\"font-size: 19px\">Win it, then build it<\u002Fstrong><span style=\"color: #4a5551\">Order the construction package and hand your crew the drawings.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section id=\"contact\" style=\"background: #161c1b; color: #e7ecea\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 32px; display: flex; flex-wrap: wrap; gap: 56px\">\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-family: 'Barlow Semi Condensed', Arial, sans-serif; font-weight: 700; font-size: 48px; line-height: 1.05\">Your next bathroom bid, measured first.<\u002Fh2>\n<p style=\"margin: 0; color: #c7d0cc; font-size: 19px\">Serving [service area]. Surveys are done by a working carpenter with residential remodeling experience.<\u002Fp>\n<p style=\"margin: 0; color: #c7d0cc\">[Phone] · [Email]<\u002Fp>\n<\u002Fdiv>\n<form style=\"flex: 1 1 420px; min-width: 0; background: #1f2826; border: 1px solid #33403c; border-radius: 16px; padding: 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"f-name\" style=\"font-weight: 600; font-size: 14px\">Your name<\u002Flabel><input id=\"f-name\" type=\"text\" autocomplete=\"name\" style=\"height: 46px; border-radius: 8px; border: 1px solid #44524d; background: #161c1b; color: #e7ecea; font: inherit; padding: 0 12px\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"f-co\" style=\"font-weight: 600; font-size: 14px\">Company<\u002Flabel><input id=\"f-co\" type=\"text\" autocomplete=\"organization\" style=\"height: 46px; border-radius: 8px; border: 1px solid #44524d; background: #161c1b; color: #e7ecea; font: inherit; padding: 0 12px\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"f-phone\" style=\"font-weight: 600; font-size: 14px\">Phone<\u002Flabel><input id=\"f-phone\" type=\"tel\" autocomplete=\"tel\" style=\"height: 46px; border-radius: 8px; border: 1px solid #44524d; background: #161c1b; color: #e7ecea; font: inherit; padding: 0 12px\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"f-email\" style=\"font-weight: 600; font-size: 14px\">Email<\u002Flabel><input id=\"f-email\" type=\"email\" autocomplete=\"email\" style=\"height: 46px; border-radius: 8px; border: 1px solid #44524d; background: #161c1b; color: #e7ecea; font: inherit; padding: 0 12px\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1\"><label for=\"f-job\" style=\"font-weight: 600; font-size: 14px\">Job town and bid date<\u002Flabel><input id=\"f-job\" type=\"text\" style=\"height: 46px; border-radius: 8px; border: 1px solid #44524d; background: #161c1b; color: #e7ecea; font: inherit; padding: 0 12px\"><\u002Fdiv>\n<button type=\"button\" style=\"grid-column: 1 / -1; height: 52px; border: 0; border-radius: 8px; background: #f08a4b; color: #1a120c; font: inherit; font-weight: 600; font-size: 18px; cursor: pointer\">Request a survey<\u002Fbutton>\n<\u002Fform>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #2b3633\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 24px 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: #9ba7a3; font-size: 14px\">\n<span>© [Year] [Company Name]<\u002Fspan>\n<span>Surveys are measurements for bidding, not a licensed inspection.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4300}}\">\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { mode: 'after' }; }\n  grout(rowH) {\n    let d = '', k = 0;\n    for (let y = 410; y > 30.01; y -= rowH, k++) {\n      const yt = Math.max(30, y - rowH);\n      d += 'M30 ' + yt + 'H330';\n      const start = k % 2 ? 67.5 : 105;\n      for (let x = start; x < 330; x += 75) d += 'M' + x + ' ' + yt + 'V' + y;\n    }\n    return d;\n  }\n  renderVals() {\n    const before = this.state.mode === 'before';\n    const on = 'border: 0; border-radius: 7px; padding: 8px 14px; min-height: 40px; font: inherit; font-weight: 600; cursor: pointer; background: #f08a4b; color: #1a120c';\n    const off = 'border: 0; border-radius: 7px; padding: 8px 14px; min-height: 40px; font: inherit; font-weight: 600; cursor: pointer; background: transparent; color: #c7d0cc';\n    return {\n      isBefore: before, isAfter: !before,\n      beforePressed: before ? 'true' : 'false', afterPressed: before ? 'false' : 'true',\n      beforeBtn: before ? on : off, afterBtn: before ? off : on,\n      showBefore: () => this.setState({ mode: 'before' }),\n      showAfter: () => this.setState({ mode: 'after' }),\n      groutBefore: this.grout(41), groutAfter: this.grout(38),\n      svgLabel: before ? 'Tile wall laid out by guesswork, with a sliver at the ceiling and a niche cutting tiles' : 'Tile wall with full courses and a niche on grout lines'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
