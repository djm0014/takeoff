<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Rough-In Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one question group per screen, ending on a wall elevation with the rough-in sheet beside it. */
:root{
  --bg:#eceeed; --surface:#fafbfa; --ink:#1c2321; --muted:#5a6561; --line:#cdd4d1;
  --accent:#c9541a; --accent-ink:#ffffff;
  --good:#23755a; --warn:#a56a12; --bad:#b83227;
  --tile:#ffffff; --tile-cut:#dbe5e8; --grout:#5f6a66; --recess:#3f4945; --border-tile:#a9c4d4;
  --warn-fill:#f3cf8a; --bad-fill:#ee9a8f; --wall:#dfe4e2; --tub:#f7f8f8; --wood:#ebd7ad; --block:#cf8f45; --marble:#ebe8e1;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131817; --surface:#1c2321; --ink:#e7ecea; --muted:#9ba7a3; --line:#33403c;
    --accent:#f08a4b; --accent-ink:#1a120c;
    --good:#5fc49f; --warn:#e3ad4e; --bad:#f07f72;
    --tile:#46534f; --tile-cut:#34474d; --grout:#131817; --recess:#0c100f; --border-tile:#2e5566;
    --warn-fill:#8a6a22; --bad-fill:#96392f; --wall:#26302d; --tub:#3a4542; --wood:#6b5838; --block:#a5682a; --marble:#77736b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131817; --surface:#1c2321; --ink:#e7ecea; --muted:#9ba7a3; --line:#33403c;
  --accent:#f08a4b; --accent-ink:#1a120c;
  --good:#5fc49f; --warn:#e3ad4e; --bad:#f07f72;
  --tile:#46534f; --tile-cut:#34474d; --grout:#131817; --recess:#0c100f; --border-tile:#2e5566;
  --warn-fill:#8a6a22; --bad-fill:#96392f; --wall:#26302d; --tub:#3a4542; --wood:#6b5838; --block:#a5682a; --marble:#77736b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:22px;line-height:1.1}
h2{font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.title{font-size:26px;letter-spacing:0;text-transform:none;line-height:1.1}
p{margin:0}
[hidden]{display:none!important}
.page{max-width:1080px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-direction:column;gap:8px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:500}
.bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.step{max-width:640px;width:100%;margin:0 auto}
.sub{color:var(--muted);margin-top:6px;max-width:60ch}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.wide{grid-column:1/-1}
.field label,.lab{font-size:14.5px;font-weight:600}
.field small{color:var(--muted);font-size:12.5px;line-height:1.3}
.stepper{display:grid;grid-template-columns:42px 1fr 42px}
.stepper button{background:var(--bg);border:1px solid var(--line);font-size:20px;line-height:1;height:44px;color:var(--ink)}
.stepper button:first-child{border-radius:8px 0 0 8px;border-right:0}
.stepper button:last-child{border-radius:0 8px 8px 0;border-left:0}
.stepper input{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;text-align:center;border-radius:0}
.stepper input[aria-invalid="true"]{border-color:var(--bad);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 13px;font:inherit;font-weight:500;cursor:pointer;min-height:42px}
.chips button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.big{flex-direction:column}
.chips.big button{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.chips.big button b{font-family:var(--display);font-size:19px;font-weight:600}
.chips.big button span{font-size:14.5px;opacity:.85}
.chips button b{font-weight:inherit}
.check{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.note{color:var(--muted);font-size:14.5px;background:var(--bg);border-radius:8px;padding:10px 12px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:600;min-height:44px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:center;z-index:10}
.nav-in{max-width:640px;width:100%;display:flex;gap:10px;justify-content:space-between}
.nav-in .btn{flex:1}
#pv,#svg{display:block;width:100%;height:auto}
#pv{max-height:300px;background:var(--bg);border-radius:8px}
#svg{max-height:70vh}
.results{display:flex;flex-direction:column;gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.opt[aria-pressed="true"]{border:2px solid var(--accent);padding:9px 11px}
.opt small{grid-column:1;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.opt b{grid-column:1;font-family:var(--display);font-size:18px;font-weight:600}
.opt span{grid-column:1;color:var(--muted);font-size:14px}
.opt .dot{grid-column:2;grid-row:1/4;align-self:center}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--good);display:inline-block}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.tune{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center}
.tune .lab{grid-column:1/-1}
.tune b{text-align:center;font-family:var(--display);font-size:17px}
svg.mono{background:#fff;border-radius:8px}
svg .pres{display:none}
svg.mono .pres{display:inline}
svg.mono .constr{display:none}
svg.mono.hidein .inn{display:none}
svg.mono rect[class^="p-"]{fill:#fff;stroke:#000}
svg.mono [fill="var(--grout)"],svg.mono [fill="var(--recess)"],svg.mono [fill="var(--wall)"]{fill:#fff}
svg.mono [fill="var(--accent)"]{fill:#222}
svg.mono [stroke="var(--ink)"],svg.mono [stroke="var(--recess)"]{stroke:#000}
svg.mono .tub{fill:#fff;stroke:#000}
svg.mono .marble{fill:#fff;stroke:#000}
svg.mono .dim{stroke:#000}
svg.mono text,svg.mono .t-muted,svg.mono .t-bad,svg.mono .t-warn,svg.mono .t-out{fill:#000}
svg.mono .t-halo{stroke:#fff}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px;font-weight:600;min-height:42px}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--surface)}
.legend .ln.mut{border-top-color:var(--muted)}
.wood{fill:var(--wood);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.block{fill:var(--block);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.filler{fill:var(--wood);fill-opacity:.5;stroke:var(--ink);stroke-width:1px;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
.txt{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;padding:0 12px;width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.headline{font-family:var(--display);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border:1px solid var(--grout);display:inline-block}
.legend .ln{width:16px;height:0;border:0;border-top:2px dashed var(--ink)}
.legend .ln.acc{border-top-color:var(--accent)}
.sheet{margin:0;display:flex;flex-direction:column}
.sheet div{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.sheet div:first-child{border-top:0}
.sheet dt{color:var(--muted);font-size:14.5px}
.sheet dd{margin:0;font-weight:600}
.sheet .hl dd{font-family:var(--display);font-size:20px;color:var(--accent)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
ul.res,ul.ans{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.res li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
ul.res li:first-child,ul.ans li:first-child{border-top:0}
.res-v{font-weight:600;text-align:right}
.pill{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1.5px solid currentColor;min-width:76px;text-align:center}
.s-full .pill,.s-ok .pill{color:var(--good)} .s-warn .pill,.s-notch .pill{color:var(--warn)}
.s-bad .pill{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
ul.ans li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
ul.ans li div{display:flex;flex-direction:column;min-width:0}
ul.ans span{color:var(--muted);font-size:14.5px}
details summary{cursor:pointer;font-weight:600}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:4px;max-width:65ch}
svg text{font-family:var(--display);font-weight:600;fill:var(--ink)}
svg .t-halo{paint-order:stroke;stroke:var(--tile);stroke-linejoin:round}
svg .t-out{stroke:none}
svg .t-muted{fill:var(--muted);stroke:none}
svg .t-bad{fill:var(--bad);stroke:none} svg .t-warn{fill:var(--warn);stroke:none}
svg rect[class^="p-"]{stroke:var(--grout);stroke-width:1px;vector-effect:non-scaling-stroke}
.p-full{fill:var(--tile)} .p-ok{fill:var(--tile-cut)} .p-warn{fill:var(--warn-fill)} .p-bad{fill:var(--bad-fill)} .p-border{fill:var(--border-tile)} .marble{fill:var(--marble);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.tub{fill:var(--tub);stroke:var(--ink);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.dim{stroke:var(--accent)}
@media (min-width:900px){
  .results{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  .results .col:first-child{position:sticky;top:12px}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Niche Rough-In Planner</h1>
    <div class="prog"><span id="stepLabel"></span><div class="bar"><i id="barFill"></i></div></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav"><div class="nav-in">
  <button class="btn ghost" id="back" type="button">Back</button>
  <button class="btn" id="next" type="button">Next</button>
</div></nav>

<script>
/*LOGIC*/
const EPS=1/64,TOL=0.04;
const DEF={framed:'',wallW:60,ceilLevel:true,ceilL:96,ceilR:96,base:'tub',tubH:15,tubPos:'full',tubL:60,
  tilePreset:'3x12',tileH:3,tileW:12,grout:0.125,pattern:'half',minFrac:0.5,
  board:0.5,thinset:0.125,tileT:0.375,gap:0.125,
  rW:14.5,rH:26,rSill:46,rLeft:22.75,
  nPreset:'12x24',nW:12,nH:24,nSill:48,studs:'free',studOC:16,bayL:22.75,nPos:'wall',nLeft:22,
  shelves:1,shelfT:0.5,frameOn:'no',frameW:2,center:'niche',edge:'none',slopeMode:'full',slopeRun:24,studD:3.5,wallType:'niche',widthRef:'framing',minReach:0.25,maxReach:0.5,tubSlide:'center',fitClear:0.125,furSplit:'even',framing:'new',studMode:'oc',stud1:16,exOC:16,studList:'',sillType:'tile',sillT:0.75,sillProj:1};
const RANK={full:0,border:0,ok:1,notch:1,warn:2,bad:3};
const worse=(a,b)=>RANK[a]>=RANK[b]?a:b;

function parseIn(s){
  s=String(s).trim().replace(/["″”]/g,'').replace(/\s*in\.?$/i,'').trim();
  if(!s) return NaN; let m;
  if((m=s.match(/^(\d+)[\s-]+(\d+)\s*\/\s*(\d+)$/))&&+m[3]) return +m[1]+m[2]/m[3];
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))&&+m[2]) return m[1]/m[2];
  if(/^(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
  return NaN;
}
function fmt(v,mark){
  const neg=v<0, s=Math.round(Math.abs(v)*16), w=Math.floor(s/16); let n=s%16,d=16;
  while(n&&n%2===0){n/=2;d/=2;}
  return (neg&&s?'−':'')+(n?(w?w+' ':'')+n+'/'+d:String(w))+(mark===false?'':'″');
}
function mod(a,m){let r=((a%m)+m)%m; if(m-r<1e-6) r=0; return r;}
const bu=S=>S.board+S.thinset+S.tileT;
const ext=S=>S.frameOn==='yes'?S.frameW+S.grout:0;
const marble=S=>S.sillType==='marble';
const furTot=S=>0;
function tubFit(S){if(!(S.base==='tub'&&S.tubPos==='full'&&S.edge==='none'))return null;
  const B=bu(S),base=S._tile?S._frW:S.wallW,FW=S.widthRef==='framing'?base:base+2*B,room=FW-S.tubL,narrow=room<-1e-6;
  const gL=S.tubSlide==='left'?0:S.tubSlide==='right'?room:room/2,gR=room-gL;
  const end=(side,gap)=>{const reach=B-gap;return {side,gap,reach,low:reach<S.minReach-1e-6,high:reach>S.maxReach+1e-6,
    furMin:Math.max(0,gap-(B-S.minReach)),furMax:Math.max(0,gap-(B-S.maxReach))};};
  const ends=[end('left',gL),end('right',gR)];
  return {narrow,ends,ok:!narrow&&ends.every(e=>!e.low&&!e.high),low:ends.some(e=>e.low)};}
function endText(e){const r=`${e.side==='left'?'Left':'Right'} end: tile laps ${e.reach>0?fmt(e.reach):'0″'} onto the lip (${fmt(e.gap)} tub to stud)`;
  if(e.low) return `${r}. Furring required: fur ${fmt(e.furMin)} to ${fmt(e.furMax)}.`;
  if(e.high) return `${r}, more than ${fmt(S.maxReach)}.`;
  return r+'.';}
function fitText(f){if(f.narrow) return 'The tub won’t fit: the studs are closer together than the tub is long.';return f.ends.map(endText).join(' ');}
function fitItems(S){const f=tubFit(S);if(!f)return [];
  if(f.narrow) return [['Tub fit','tub won’t fit','bad','Too narrow']];
  return f.ends.map(e=>[`Tile onto tub lip, ${e.side} end`,e.reach>0?fmt(e.reach):'none',e.low?'bad':e.high?'warn':'full',e.low?'Furring req.':e.high?'Over '+fmt(S.maxReach):'OK']);}
const furL=S=>S.furSplit==='right'?0:S.furSplit==='left'?furTot(S):furTot(S)/2;
const furR=S=>furTot(S)-furL(S);
const endAdj=(S,side)=>S.widthRef!=='framing'?0:(S.edge===side?0:bu(S)+(side==='left'?furL(S):furR(S)));
const finW=S=>S.wallW-endAdj(S,'left')-endAdj(S,'right');
function tileS(S){if(S._tile)return S;return Object.assign({},S,{wallW:finW(S),_tile:true,_frW:S.wallW,_offL:endAdj(S,'left'),_furL:furL(S),_furR:furR(S)});}
function studCenters(S,W){const SW=1.5,cs=[];
  if(S.framing==='existing'){
    if(S.studMode==='list'){for(const t of String(S.studList).split(/[,;]+/)){const v=parseIn(t);if(!isNaN(v))cs.push(v);}}
    else if(S.exOC>0){for(let c=S.stud1;c<W&&cs.length<200;c+=S.exOC)cs.push(c);}
  } else {const bayMode=S.framed!=='yes'&&S.studs==='bay'&&!isPlain(S),OC=bayMode?S.studOC:16,c0=bayMode?S.bayL-SW/2:IN.studStart==='right'?W-OC:OC;for(let k=-60;k<=60;k++)cs.push(c0+k*OC);}
  const ok=cs.filter(c=>c-SW/2>=SW-0.01&&c+SW/2<=W-SW+0.01);
  return [0].concat(ok.map(c=>c-SW/2)).concat([W-SW]).sort((a,b)=>a-b).filter((x,i,a)=>i===0||x-a[i-1]>=SW-0.01);}
const sillGap=S=>marble(S)?S.sillT+S.grout:ext(S);
const sillDrop=S=>marble(S)?S.sillT+S.thinset+S.board:bu(S);
const cRv=S=>S.ceilLevel?S.ceilL:S.ceilR;
const slopeRun=S=>(!S.ceilLevel&&S.slopeMode==='part'&&S.ceilL!==S.ceilR)?Math.min(Math.max(S.slopeRun,0.5),S.wallW):S.wallW;
const ceilAt=(S,x)=>{const L=S.ceilL,R=cRv(S),W=S.wallW,run=slopeRun(S);
  if(run>=W-1e-9) return L+(R-L)*x/W;
  if(L<R) return x<run?L+(R-L)*x/run:R;
  return x>W-run?L+(R-L)*(x-(W-run))/run:L;};
function ceilPts(S){const L=S.ceilL,R=cRv(S),W=S.wallW,run=slopeRun(S),pts=[[W,R]];
  if(run<W-0.05) pts.push(L<R?[run,R]:[W-run,L]);
  pts.push([0,L]);return pts;}
function tubX(S){
  if(S.base!=='tub') return null;
  const W=S.wallW,L=Math.min(S.tubL,W);
  if(S.tubPos==='full') return {a:0,b:W};
  if(S.tubPos==='left') return {a:0,b:L};
  if(S.tubPos==='right') return {a:W-L,b:W};
  const a=(W-L)/2; return {a,b:a+L};
}
const baseY=S=>(S.base==='tub'?S.tubH:0)+S.gap;
const fieldL=S=>S.edge==='left'?S.frameW+S.grout:S.gap;
const fieldR=S=>S.edge==='right'?S.wallW-S.frameW-S.grout:S.wallW-S.gap;
function edgeParts(S){
  if(S.edge!=='left'&&S.edge!=='right') return null;
  const W=S.wallW,bw=S.frameW,x0=S.edge==='left'?0:W-bw,x1=x0+bw,tb=tubX(S),t=S.tileW,g=S.grout;
  const y0=tb&&tb.a<=x0+0.05&&tb.b>=x1-0.05?baseY(S):S.gap,y1=Math.min(ceilAt(S,x0),ceilAt(S,x1))-S.gap,ps=[];
  let y=y0; for(let i=0;y<y1-0.05&&i<200;i++){const h=Math.min(t,y1-y);ps.push({y,h});y+=h+g;}
  const top=ps.length?ps[ps.length-1].h:0;
  return {x0,bw,y0,ps,top,st:top<t-EPS?stat(S,top,t):'full'};
}
function floorZone(S){const x=tubX(S);return !!x&&(x.a>0.05||x.b<S.wallW-0.05);}
const tubCenter=S=>{const x=tubX(S);return x?(x.a+x.b)/2:S.wallW/2;};
function grid(S,p){const t=S.tileH,g=S.grout,b=baseY(S);return {t,g,m:t+g,b,T0:b+p,p};}
function shiftCount(S){return S.pattern==='stack'?1:S.pattern==='half'?2:3;}
function rowShift(S,i){const c=shiftCount(S);return mod(i,c)*(S.tileW+S.grout)/c;}
function rowPieces(S,x0,shift,L0,R0){
  const w=S.tileW,mw=w+S.grout,L=L0==null?fieldL(S):L0,R=R0==null?fieldR(S):R0,out=[];

  const ml=fs*(r?6.4:4.4),mr=fs*(r?5:4.4),mt=fs*2.7,mb=fs*3.4;
  const Y=y=>H-y,f=n=>Math.round(n*1000)/1000;
  const poly=`0,${f(Y(0))} ${f(W)},${f(Y(0))} `+ceilPts(S).map(([x,y])=>f(x)+','+f(Y(y))).join(' ');
  const R=(x,y,w,h,cls,extra)=>`<rect${cls?` class="${cls}"`:''} x="${f(x)}" y="${f(Y(y+h))}" width="${f(Math.max(w,0))}" height="${f(Math.max(h,0))}"${extra?' '+extra:''}/>`;
  const T=(x,y,s,a,size,cls)=>`<text class="${cls||'t-halo'}" x="${f(x)}" y="${f(Y(y))}" font-size="${f(size)}" text-anchor="${a}" stroke-width="${f(size*0.3)}">${s}</text>`;
  const Ln=(x1,y1,x2,y2,extra)=>`<line x1="${f(x1)}" y1="${f(Y(y1))}" x2="${f(x2)}" y2="${f(Y(y2))}" ${extra}/>`;
  const dimA=`class="dim" stroke-width="${f(fs*0.08)}"`,tk=fs*0.35;
  let o=`<defs><clipPath id="wc"><polygon points="${poly}"/></clipPath></defs><polygon points="${poly}" fill="${r?'var(--grout)':'var(--wall)'}"/>`;
  if(r){
    const G=r.G,h=r.h,t=S.tileH,tw=S.tileW; let g2='';
    const iLo=Math.floor((S.gap-G.T0)/G.m)+1,iHi=Math.ceil((H+t-G.T0)/G.m);
    for(let i=iLo;i<=iHi;i++){
      const Ti=G.T0+i*G.m;
      for(const pc of rowPieces(S,h.x0,rowShift(S,i))){
        const ov=!!tb&&pc.x<tb.b-0.05&&pc.x+pc.w>tb.a+0.05,inside=ov&&pc.x>=tb.a-0.01&&pc.x+pc.w<=tb.b+0.01;
        if(inside&&Ti<=G.b+0.05) continue;
        const cMax=Math.max(ceilAt(S,pc.x),ceilAt(S,pc.x+pc.w));
        if(Ti-t>=cMax-S.gap) continue;
        const vb=Math.max(Ti-t,(ov&&Ti>G.b+0.05)?G.b:S.gap),ct=Math.min(ceilAt(S,pc.x),ceilAt(S,pc.x+pc.w))-S.gap,vh=Math.min(Ti,ct)-vb;
        let st=vh>=t-EPS?'full':stat(S,vh,t);
        if(pc.w<tw-EPS){const edge=pc.x<=fieldL(S)+0.01||pc.x+pc.w>=fieldR(S)-0.01;st=worse(st,edge?stat(S,pc.w,tw):'ok');}
        const yb=Math.max(Ti-t,0);
        g2+=R(pc.x,yb,pc.w,Ti-yb,'p-'+st);
      }
    }
    const ep=edgeParts(S);
    if(ep) for(const q of ep.ps){const st=q.h<tw-EPS?stat(S,q.h,tw):'full';g2+=R(ep.x0,q.y,ep.bw,q.h,'p-'+(RANK[st]>=2?st:'border'));}
    o+=`<g clip-path="url(#wc)">${g2}</g>`;
    o+=Ln(0,G.T0+G.g,W,G.T0+G.g,`class="constr" stroke="var(--accent)" stroke-width="${f(fs*0.09)}" stroke-dasharray="${f(fs*0.4)} ${f(fs*0.25)}"`);
  }
  if(tb){
    o+=R(tb.a,0,tb.b-tb.a,S.tubH,'tub');
    o+=T((tb.a+tb.b)/2,S.tubH/2-fs*0.35,r?'TUB':`${fmt(tb.b-tb.a)} tub`,'middle',fs*0.9,'t-muted');
  }
  if(r&&!r.plain){
    const G=r.G,h=r.h,t=S.tileH,tw=S.tileW,g=S.grout,e=ext(S),B=bu(S),x1=h.L,x2=h.L+h.w,y1=r.sF,y2=r.sF+r.hF;
    if(marble(S)&&!e) o+=R(x1,y1-sillGap(S),h.w,sillGap(S),null,'fill="var(--grout)"');
    if(e){
      o+=R(x1-e,y1-sillGap(S),h.w+2*e,r.hF+e+sillGap(S),null,'fill="var(--grout)"');
      const fw=S.frameW,ps=[];
      for(const s of splitLen(x1-fw,x2+fw,tw,g)){if(!marble(S))ps.push([s.s,y1-fw,s.l,fw,s.l]);ps.push([s.s,y2,s.l,fw,s.l]);}
      if(r.hF>2*g+0.1) for(const s of splitLen(y1+g,y2-g,tw,g)){ps.push([x1-fw,s.s,fw,s.l,s.l]);ps.push([x2,s.s,fw,s.l,s.l]);}
      for(const [x,y,w,hh,len] of ps){const s=len<tw-EPS?stat(S,len,tw):'full';o+=R(x,y,w,hh,'p-'+(RANK[s]>=2?s:'border'));}
    }
    o+=R(x1,y1,h.w,r.hF,null,'fill="var(--recess)"');
    let yb=y1;
    r.int.bays.forEach((b,bi)=>{
      let y=yb;
      b.rows.forEach((rh,k)=>{
        const ps=rowPieces(S,h.ix,shiftIn(S,k),x1,x2),edge=k===0||k===b.rows.length-1;
        for(const pc of ps){
          let st=rh<t-EPS?(edge?stat(S,rh,t):'ok'):'full';
          if(pc.w<tw-EPS) st=worse(st,ps.length>1?stat(S,pc.w,tw):'ok');
          o+=R(pc.x,y,pc.w,rh,'p-'+st+' inn');
        }
        y+=rh+g;
      });
      yb+=b.hb+S.shelfT;
    });
    for(const s of r.int.shelves) o+=marble(S)?R(x1,y1+s,h.w,S.shelfT,'marble'):R(x1,y1+s,h.w,S.shelfT,null,'fill="var(--accent)"');
    if(marble(S)) o+=R(x1,y1-S.sillT,h.w,S.sillT,'marble');
    o+=R(x1,y1,h.w,r.hF,null,`fill="none" stroke="var(--recess)" stroke-width="${f(fs*0.16)}"`);
    // niche dimensions
    o+='<g class="constr">';
    const cx=(x1+x2)/2,useTub=S.framed!=='yes'&&S.studs!=='bay'&&S.nPos==='tub'&&tb,x0=useTub?tb.a:0;
    o+=Ln(cx,0,cx,Math.min(ceilAt(S,cx),H),`stroke="var(--accent)" stroke-width="${f(fs*0.06)}" stroke-dasharray="${f(fs*0.9)} ${f(fs*0.25)} ${f(fs*0.15)} ${f(fs*0.25)}"`);
    o+=T(cx,H+fs*0.6,'℄ niche','middle',fs*0.8,'t-out');
    const dy=Math.max(fs*2.2,y1-sillGap(S)-fs*1.6);
    if(cx-x0>fs*2){o+=Ln(x0,dy,cx,dy,dimA)+Ln(x0,dy-tk,x0,dy+tk,dimA)+Ln(cx,dy-tk,cx,dy+tk,dimA);
      o+=T((x0+cx)/2,dy+fs*0.3,fmt(cx-x0)+(useTub&&x0>0.01?' from tub':''),'middle',fs*0.9);}
    const a=fmt(h.w)+' × '+fmt(r.hF),ns=Math.min(fs*0.85,h.w/(a.length*0.5));
    o+=T(cx,y2-ns*1.4,a,'middle',ns)+T(cx,y2-ns*2.5,'finished','middle',ns*0.8);
    o+='</g>';
    {const fa=fmt(h.w)+' × '+fmt(r.hF),fsz=Math.min(fs*0.85,h.w/(fa.length*0.5));o+='<g class="pres">'+T(cx,y2-fsz*1.4,fa,'middle',fsz)+'</g>';}
  }
  if(r){const G=r.G,t=S.tileH;
    // edge labels
    const cls=s=>s==='bad'?'t-bad':s==='warn'?'t-warn':'t-out';
    o+='<g class="constr">';
    o+=T(W+fs*0.5,G.b+r.p/2-fs*0.35,r.p<t-EPS?fmt(r.p):'full','start',fs*0.95,cls(stat(S,r.p,t)));
    o+=T(W+fs*0.5,cR-S.gap-r.cr/2-fs*0.35,r.cr<t-EPS?fmt(r.cr):'full','start',fs*0.95,cls(stat(S,r.cr,t)));
    if(!S.ceilLevel) o+=T(-fs*0.5,cL-S.gap-r.cl/2-fs*0.35,r.cl<t-EPS?fmt(r.cl):'full','end',fs*0.95,cls(stat(S,r.cl,t)));
    o+='</g>';
    o+=T(-fs*0.5,G.T0+G.g+fs*0.15,S.base==='tub'?'ledger, above tub':'ledger','end',fs*0.7,'constr t-muted')+T(-fs*0.5,G.T0+G.g-fs*0.9,fmt(G.T0+G.g-(S.base==='tub'?S.tubH:0)),'end',fs*0.85,'constr t-out');
  }
  o+=`<polygon points="${poly}" fill="none" stroke="var(--ink)" stroke-width="${f(fs*0.1)}"/>`;
  // overall dimensions
  o+=Ln(0,-fs*1.2,W,-fs*1.2,dimA)+Ln(0,-fs*1.2-tk,0,-fs*1.2+tk,dimA)+Ln(W,-fs*1.2-tk,W,-fs*1.2+tk,dimA);
  o+=T(W/2,-fs*2.6,fmt(W)+(r&&S.widthRef==='framing'?' finished':' wide'),'middle',fs*0.95,'t-out');
  if(r){
    const vch=(pts,x,side)=>{let q=Ln(x,pts[0],x,pts[pts.length-1],dimA);for(const p of pts)q+=Ln(x-tk,p,x+tk,p,dimA);
      for(let i=0;i<pts.length-1;i++){const tx=x+(side<0?-fs*0.3:fs*0.95),ty=Y((pts[i]+pts[i+1])/2);
        q+=`<text class="t-out" x="${f(tx)}" y="${f(ty)}" font-size="${f(fs*0.85)}" text-anchor="middle" transform="rotate(-90 ${f(tx)} ${f(ty)})">${fmt(pts[i+1]-pts[i])}</text>`;}return q;};
    o+='<g class="constr">'+(tb&&tb.a<0.05?vch([0,S.tubH,cL],-fs*3.5,-1)+vch([0,cL],-fs*4.9,-1):vch([0,cL],-fs*3.5,-1))+(S.ceilLevel?'':vch([0,cR],W+fs*3.7,1))+'</g>';
  } else {
  if(S.ceilLevel) o+=T(W/2,H+fs*0.7,fmt(cL)+' floor to ceiling','middle',fs*0.85,'t-muted');
  else{o+=T(0,H+fs*0.7,fmt(cL),'start',fs*0.85,'t-muted');o+=T(W,H+fs*0.7,fmt(cR),'end',fs*0.85,'t-muted');}
  }
  if(tb&&r&&tb.a>=0.05){o+='<g class="constr">'+Ln(tb.a-fs*1.2,0,tb.a-fs*1.2,S.tubH,dimA)+Ln(tb.a-fs*1.2-tk,S.tubH,tb.a-fs*1.2+tk,S.tubH,dimA)+T(tb.a-fs*1.6,S.tubH/2-fs*0.35,fmt(S.tubH),'end',fs*0.9)+'</g>';}
  if(tb&&!r){o+=Ln(-fs*0.9,0,-fs*0.9,S.tubH,dimA)+Ln(-fs*0.9-tk,S.tubH,-fs*0.9+tk,S.tubH,dimA);o+=T(-fs*1.3,S.tubH/2-fs*0.35,fmt(S.tubH),'end',fs*0.95,'t-out');}
  svg.setAttribute('viewBox',`${f(-ml)} ${f(-mt)} ${f(W+ml+mr)} ${f(H+mt+mb)}`);
  svg.innerHTML=o;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.choice){const fd=FM[b.dataset.choice],o=fd.opts[+b.dataset.i];S[fd.id]=o[0];if(fd.on)fd.on(o[0]);render();return;}
  if(b.dataset.nudge){const fd=FM[b.dataset.nudge],v=Math.round((S[fd.id]+fd.step*b.dataset.dir)*16)/16;
    if(v>=fd.min&&v<=fd.max){S[fd.id]=v;const el=$(fd.id);el.value=fmt(v,false);el.setAttribute('aria-invalid','false');if(STEPS[cur].id==='results')render();else live();}return;}
  if(b.dataset.opt!=null){optIdx=+b.dataset.opt;adjH=0;adjS=0;adjHin=0;adjSin=0;renderResults(true);return;}
  if(b.dataset.open){openJob(b.dataset.open);return;}
  if(b.dataset.del){deleteJob(b.dataset.del);return;}
  if(b.id==='saveJob'||b.id==='saveNew'){saveJob(b.id==='saveNew',b);return;}
  if(b.id==='dlSheet'){downloadSheet(b);return;}
  if(b.id==='fitBay'){S.studs='bay';S.studOC=+b.dataset.oc;S.bayL=Math.round(+b.dataset.l*16)/16;render();return;}
  if(b.dataset.in){const k=b.dataset.in,v=b.dataset.v;
    if(k==='shelfPos'&&v==='custom'&&lastR){const s=lastR.int.shelves;if(s[0]!=null)IN.shelf1=Math.round(s[0]*16)/16;if(s[1]!=null)IN.shelf2=Math.round(s[1]*16)/16;}
    IN[k]=v;save();renderResults(true);return;}
  if(b.dataset.innudge){const k=b.dataset.innudge;IN[k]=Math.max(0,Math.round((IN[k]+0.125*b.dataset.dir)*16)/16);save();renderResults(true);return;}
  if(b.dataset.snap){const [hi,si]=b.dataset.snap.split(',').map(Number);adjHin+=hi;adjSin+=si;renderResults(true);return;}
  if(b.dataset.adj){if(b.dataset.adj==='reset'){adjH=0;adjS=0;adjHin=0;adjSin=0;}else{const [k,v]=b.dataset.adj.split(',');if(k==='h')adjH+=+v;else adjS+=+v;}renderResults(true);return;}
  if(b.dataset.edit!=null){cur=+b.dataset.edit;ret=true;render();window.scrollTo(0,0);return;}
  const last=STEPS.length-1;
  if(b.id==='next'){cur=ret?last:Math.min(cur+1,last);while(cur<last&&STEPS[cur].skip&&STEPS[cur].skip(S))cur++;if(cur===last)ret=false;render();window.scrollTo(0,0);}
  else if(b.id==='back'){cur=Math.max(0,cur-1);while(cur>0&&STEPS[cur].skip&&STEPS[cur].skip(S))cur--;ret=false;render();window.scrollTo(0,0);}
  else if(b.id==='restart'){curJob=null;S=Object.assign({},DEF);IN=Object.assign({},IN0);cur=0;ret=false;render();window.scrollTo(0,0);}
  else if(b.id==='copy'){
    const txt=['Niche rough-in'].concat(lastSheet.map(([a,v])=>v?a+': '+String(v).replace(/<br>/g,'; '):a)).join('\n');
    try{navigator.clipboard.writeText(txt).then(()=>{b.textContent='Copied';},()=>{b.textContent='Copy failed';});}catch(err){b.textContent='Copy failed';}
  }
});
document.addEventListener('input',e=>{
  const el=e.target,fd=FM[el.id]; if(fd&&fd.t==='text'){S[fd.id]=el.value;live();return;} if(!fd||fd.t!=='num') return;
  const v=parseIn(el.value),ok=!isNaN(v)&&v>=fd.min&&v<=fd.max;
  el.setAttribute('aria-invalid',ok?'false':'true'); if(ok){S[fd.id]=v;live();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id&&el.id.startsWith('in_')){const v=parseIn(el.value);if(!isNaN(v)&&v>=0&&v<=120){IN[el.id.slice(3)]=v;save();}renderResults(true);return;}
  const fd=FM[el.id]; if(!fd) return;
  if(fd.t==='check'){S[fd.id]=el.checked;render();}
  else if(fd.t==='num'){el.value=fmt(S[fd.id],false);el.setAttribute('aria-invalid','false');if(STEPS[cur].id==='results')render();}
});
render();
</script>
